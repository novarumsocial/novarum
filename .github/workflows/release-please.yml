name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  # builds the native APK and unsigned IPA and attaches them to the release
  native:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/native-development-release.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # builds the Linux, Windows and macOS desktop apps and attaches them to the release
  desktop:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/desktop-development-release.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit
