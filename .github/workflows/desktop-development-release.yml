name: Release desktop development build

on:
  workflow_dispatch:
  # called by release-please.yml to attach the desktop builds to a versioned release
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  push:
    branches:
      - main
    paths:
      - 'apps/electron/**'
      - 'apps/frontend/**'
      - '.github/workflows/desktop-development-release.yml'

permissions:
  contents: read

jobs:
  # releases use their version and upload to the existing v<version> release; other builds are
  # prereleases of the next patch (0.2.1 -> 0.2.2-dev.<run>) so they sort above the last release
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            version="$RELEASE_VERSION"
          else
            IFS=. read -r major minor patch < <(jq -r .version apps/electron/package.json)
            version="${major}.${minor}.$((patch + 1))-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-linux-windows:
    name: Build desktop (Linux and Windows)
    needs: version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container: electronuserland/builder:wine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DESKTOP_VERSION: ${{ needs.version.outputs.version }}
          HOME: /tmp/novarum-builder
          WINEDEBUG: '-all'
          WINEPREFIX: /tmp/novarum-builder/.wine
        run: |
          mkdir -p "$HOME"
          bun run --filter desktop build:linux-windows

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-windows
          path: |
            apps/electron/dist/*.AppImage
            apps/electron/dist/*.deb
            apps/electron/dist/*.exe
            apps/electron/dist/*.blockmap
            apps/electron/dist/dev*.yml
            apps/electron/dist/latest*.yml
          if-no-files-found: error

  build-macos:
    name: Build desktop (macOS)
    needs: version
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DESKTOP_VERSION: ${{ needs.version.outputs.version }}
        run: bun run --filter desktop build:macos

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            apps/electron/dist/*.dmg
            apps/electron/dist/*.zip
            apps/electron/dist/*.blockmap
            apps/electron/dist/dev*.yml
            apps/electron/dist/latest*.yml
          if-no-files-found: error

  release:
    name: Publish development release
    needs:
      - version
      - build-linux-windows
      - build-macos
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          release_tag="v${DESKTOP_VERSION}"
          notes="Development build for commit ${GITHUB_SHA}."

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/* --clobber
          else
            gh release create "$release_tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$release_tag" \
              --notes "$notes" \
              --prerelease
          fi
