name: Build Anchor image

on:
  push:
    branches:
      - '**'
    paths:
      - 'apps/anchor/**'
      - '.github/workflows/anchor-image.yml'

concurrency:
  group: anchor-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Set image tags
        id: image
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          sha="${GITHUB_SHA::7}"
          tags=("ghcr.io/novarumsocial/anchor:${branch}" "ghcr.io/novarumsocial/anchor:${branch}-${sha}")
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags+=("ghcr.io/novarumsocial/anchor:latest")
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Anchor image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/anchor/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
