name: Release mobile development build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'apps/frontend/**'
      - '.github/workflows/mobile-development-release.yml'

permissions:
  contents: read

env:
  MOBILE_VERSION: 1.0.0-dev.${{ github.run_number }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore signing keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/keystore/release.jks
        working-directory: apps/mobile

      - name: Write signing environment
        run: |
          cat > .env <<'EOF'
          ANDROID_KEYSTORE_PATH=android/keystore/release.jks
          ANDROID_KEYSTORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS=${{ secrets.ANDROID_KEY_PASS }}
          EOF
        working-directory: apps/mobile

      - name: Add apksigner to PATH
        run: |
          echo "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)" >> "$GITHUB_PATH"

      - name: Build mobile app
        run: bun run android:build
        working-directory: apps/mobile

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error

  release:
    name: Publish development release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v${MOBILE_VERSION}"
          notes="Development build for commit ${GITHUB_SHA}."

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/* --clobber
          else
            gh release create "$release_tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$release_tag" \
              --notes "$notes" \
              --prerelease
          fi
