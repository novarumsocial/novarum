[package]
name = "novarum-desktop"
version = "0.2.1"
edition = "2024"
description = "Novarum desktop client"
publish = false

[[bin]]
name = "novarum"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.10.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "multipart", "stream"] }
reqwest_cookie_store = "0.8"
cookie_store = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
rust-embed = "8"
semver = "1"
self-replace = "1"
tar = "0.4"
flate2 = "1"
rand = "0.9"
